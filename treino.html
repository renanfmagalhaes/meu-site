<script>
  // Sempre abre o treino marcado como "current": true em assets/data/treinos.json.
  // Assim, ao cadastrar um novo treino no JSON, este link passa a abrir o mais recente
  // sem precisar editar este arquivo.
  (async function goToCurrentTreino(){
    try{
      const res = await fetch("assets/data/treinos.json");
      const list = await res.json();
      const current = Array.isArray(list) ? list.find(t => t.current) : null;
      if(current && current.file){
        window.location.replace(current.file);
      }
    }catch(e){
      console.error("Não foi possível determinar o treino atual, usando o padrão.", e);
      // mantém o <meta http-equiv="refresh"> como rede de segurança
    }
  })();
</script>
